# [SECURITY_CHECKLIST #65] Stage 1 secret custody: keys as Docker secrets, not
# environment variables (production refuses AUTHORITY_SECRET_KEY /
# SESSION_KEYSTORE_KEY in env; see aof_backend/src/security/secretFiles.ts).
#
#   install -d -m 700 secrets
#   (umask 077; printf '%s' '<base58 operator key>' > secrets/authority_secret_key)
#   (umask 077; openssl rand -base64 32 > secrets/session_keystore_key)
#   docker compose -f docker-compose.prod.yml -f docker-compose.secrets.yml up -d
#
# Remove AUTHORITY_SECRET_KEY / SESSION_KEYSTORE_KEY from aof_backend/.env
# (keep that file encrypted with SOPS/age). Read-only deployments
# (AUTHORITY_MODE=read-only) must NOT use this override.
# Stage 2 (before mainnet): the operator key moves to HashiCorp Vault Transit.
services:
  backend:
    environment:
      AUTHORITY_SECRET_KEY_FILE: /run/secrets/authority_secret_key
      SESSION_KEYSTORE_KEY_FILE: /run/secrets/session_keystore_key
    secrets: [authority_secret_key, session_keystore_key]
  price-cranker:
    environment:
      AUTHORITY_SECRET_KEY_FILE: /run/secrets/authority_secret_key
    secrets: [authority_secret_key]
  commit-expirer:
    environment:
      AUTHORITY_SECRET_KEY_FILE: /run/secrets/authority_secret_key
    secrets: [authority_secret_key]

secrets:
  authority_secret_key:
    file: ./secrets/authority_secret_key
  session_keystore_key:
    file: ./secrets/session_keystore_key
